<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="mobile.css">
<title>EnglishUp — Đăng ký tài khoản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js"></script>
<style>
:root{
  --bg:#08090d;--surface:#0e1018;--card:#151a25;--card2:#1b2133;
  --border:#232d42;--border2:#2e3a55;
  --accent:#4f8ef7;--a2:#a78bfa;--a3:#34d399;--a4:#fb923c;--a5:#f472b6;
  --danger:#f87171;--text:#dde3f0;--muted:#64748b;
  --mono:'JetBrains Mono',monospace;--radius:10px;--radius-lg:16px;--topbar-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:50}
.topbar .logo{font-weight:700;font-size:18px;color:var(--accent);letter-spacing:-.4px;text-decoration:none}
.topbar .logo span{color:var(--a2)}
.top-nav{display:flex;gap:4px;margin-left:14px}
.top-nav a{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px}
.top-nav a:hover{color:var(--text);background:var(--card)}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 18px 60px}
.auth-card{width:440px;max-width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 28px}
.auth-card h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.auth-card .sub{font-size:13px;color:var(--muted);margin:4px 0 22px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.role-opt{cursor:pointer;border:1px solid var(--border);background:var(--card2);border-radius:var(--radius);padding:14px;text-align:center;transition:.15s}
.role-opt:hover{border-color:var(--border2)}
.role-opt.active{border-color:var(--accent);background:rgba(79,142,247,.10)}
.role-opt .ico{font-size:26px}
.role-opt .lbl{font-weight:700;font-size:14px;margin-top:6px}
.role-opt .dsc{font-size:11px;color:var(--muted);margin-top:2px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px}
.field input:focus{outline:none;border-color:var(--accent)}
.btn{font-family:inherit;font-weight:600;border:none;border-radius:8px;cursor:pointer;font-size:14px;padding:12px 16px;transition:.15s;width:100%}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#3b7de8}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:13px;min-height:18px;margin:4px 0 12px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--a3)}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
.foot a{color:var(--accent);text-decoration:none;font-weight:600}
.hint{font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
.success-box{display:none;text-align:center;padding:10px 0}
.success-box .ico{font-size:46px;margin-bottom:10px}
.success-box h2{font-size:18px;font-weight:700;margin-bottom:6px}
.success-box p{font-size:13px;color:var(--muted);margin-bottom:18px}
.hidden{display:none!important}
.refbox{display:flex;align-items:center;gap:10px;background:rgba(52,211,153,.08);
  border:1px solid rgba(52,211,153,.35);border-radius:10px;padding:11px 13px;margin-bottom:16px;font-size:12.5px}
.refbox .ico{font-size:19px}
.refbox b{color:var(--a3);font-family:var(--mono);letter-spacing:1px}
.refbox .x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 3px}
.refbox .x:hover{color:var(--danger)}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="topbar">
  <a href="report.html" class="logo">English<span>Up</span></a>
  <nav class="top-nav">
    <a href="video.html">🎬 Video</a>
    <a href="flashcard.html">🃏 Flashcard</a>
    <a href="vocab.html">📚 Từ vựng</a>
    <a href="game.html">🎮 Game</a>
    <a href="report.html">📊 Thống kê</a>
    <a href="posts.html">📰 Thông báo</a>
  </nav>
</header>

<div class="wrap">
  <div class="auth-card">
    <!-- FORM -->
    <div id="form-view">
      <h1>Tạo tài khoản</h1>
      <div class="sub">Đăng ký là mở khóa <b style="color:var(--a3)">toàn bộ</b> nền tảng trong <b style="color:var(--a3)">24 giờ</b> — không cần thẻ ngân hàng.</div>

      <div class="refbox hidden" id="refbox">
        <span class="ico">🤝</span>
        <span>Bạn được giới thiệu bởi mã <b id="ref-code">—</b></span>
        <span class="x" title="Bỏ mã giới thiệu" onclick="clearRef()">✕</span>
      </div>

      <div class="field">
        <label>Họ và tên</label>
        <input type="text" id="r-name" placeholder="Nguyễn Văn A" autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="r-email" placeholder="email@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label>Số điện thoại</label>
        <input type="tel" id="r-phone" placeholder="09xxxxxxxx" autocomplete="tel">
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="r-pw" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Nhập lại mật khẩu</label>
        <input type="password" id="r-pw2" placeholder="Nhập lại mật khẩu" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')doRegister()">
      </div>

      <div class="msg" id="msg"></div>
      <button class="btn btn-primary" id="btn-register" onclick="doRegister()">Đăng ký</button>

      <div class="foot">Đã có tài khoản? <a href="vocab.html">Đăng nhập</a></div>
    </div>

    <!-- SUCCESS -->
    <div class="success-box" id="success-view">
      <div class="ico">✅</div>
      <h2 id="s-title">Đăng ký thành công!</h2>
      <p id="s-desc">—</p>
      <a href="vocab.html"><button class="btn btn-primary">Vào học ngay</button></a>
      <a href="nangcap.html" style="display:block;margin-top:12px;font-size:13px;color:var(--muted);text-decoration:none">Xem bảng giá các gói →</a>
    </div>
  </div>
</div>

<script>
const SB_URL='https://fyglubimflzsetcovgqx.supabase.co';
const SB_KEY='sb_publishable_3h3EQvxWr0kba8Tyq5RNbQ_driFn_G_';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{lock:(_n,_t,fn)=>fn()}});
function setMsg(t,type){ const m=document.getElementById('msg'); m.textContent=t||''; m.className='msg'+(type?' '+type:''); }

/* ---------- Mã giới thiệu (?ref=XXXX) ---------- */
let REF_CODE = null;
(function initRef(){
  const q = new URLSearchParams(location.search).get('ref');
  let stored = null;
  try{ stored = localStorage.getItem('eu_ref'); }catch(_){}
  REF_CODE = (q || stored || '').trim().toUpperCase() || null;
  if(!REF_CODE) return;
  try{ localStorage.setItem('eu_ref', REF_CODE); }catch(_){}
  document.getElementById('ref-code').textContent = REF_CODE;
  document.getElementById('refbox').classList.remove('hidden');
})();
function clearRef(){
  REF_CODE = null;
  try{ localStorage.removeItem('eu_ref'); }catch(_){}
  document.getElementById('refbox').classList.add('hidden');
}

async function doRegister(){
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const phone=document.getElementById('r-phone').value.trim();
  const pw=document.getElementById('r-pw').value;
  const pw2=document.getElementById('r-pw2').value;
  if(!name){ setMsg('Vui lòng nhập họ tên.','err'); return; }
  if(!email){ setMsg('Vui lòng nhập email.','err'); return; }
  if(!phone){ setMsg('Vui lòng nhập số điện thoại.','err'); return; }
  if(!/^[0-9+().\s-]{8,15}$/.test(phone)){ setMsg('Số điện thoại không hợp lệ.','err'); return; }
  if(pw.length<6){ setMsg('Mật khẩu tối thiểu 6 ký tự.','err'); return; }
  if(pw!==pw2){ setMsg('Mật khẩu nhập lại không khớp.','err'); return; }

  const btn=document.getElementById('btn-register');
  btn.disabled=true; btn.textContent='Đang tạo tài khoản…'; setMsg('');
  try{
    const { data, error } = await sb.auth.signUp({
      email, password:pw,
      options:{ data:{ role:'student', full_name:name, phone, ref_code:REF_CODE||null } }
    });
    if(error) throw error;

    if(data && data.user){
      for(let i=0;i<4;i++){
        const { data:_up } = await sb.from('user_profiles').update({ phone }).eq('id', data.user.id).select('id');
        if(_up && _up.length) break;
        await new Promise(r=>setTimeout(r,400));
      }
    }

    // Gắn mã giới thiệu (cần có phiên đăng nhập). Nếu chưa có phiên,
    // mã vẫn nằm trong localStorage và topbar.js sẽ gắn ở lần đăng nhập đầu.
    let refMsg = '';
    if(REF_CODE && data && data.session){
      try{
        const { data: r } = await sb.rpc('attach_referral', { p_code: REF_CODE });
        if(r && r.ok){
          refMsg = ' Bạn đã được ghi nhận là người được ' + (r.referrer_name||'bạn của mình') + ' giới thiệu.';
          try{ localStorage.removeItem('eu_ref'); }catch(_){}
        } else if(r && r.reason === 'ma_khong_ton_tai'){
          refMsg = ' (Mã giới thiệu không tồn tại nên đã bỏ qua.)';
          try{ localStorage.removeItem('eu_ref'); }catch(_){}
        }
      }catch(_){}
    }

    const roleLabel = 'Học viên';
    document.getElementById('form-view').classList.add('hidden');
    document.getElementById('success-view').style.display='block';
    if(data.session){
      document.getElementById('s-title').textContent='Chào mừng bạn! 🎉';
      document.getElementById('s-desc').innerHTML=`Tài khoản đã sẵn sàng và bạn đã được đăng nhập.<br><b>Bạn đang có 24 giờ dùng thử toàn bộ nền tảng.</b> Hết 24 giờ, chọn một gói ở trang Nâng cấp để học tiếp.` + refMsg;
    } else {
      document.getElementById('s-title').textContent='Kiểm tra email của bạn 📧';
      document.getElementById('s-desc').textContent=`Đã gửi liên kết xác nhận tới ${email}. Xác nhận xong là có thể đăng nhập (vai trò: ${roleLabel}).`;
    }
  }catch(e){
    btn.disabled=false; btn.textContent='Đăng ký';
    let m=e.message||'Đăng ký thất bại';
    if(/already registered|already exists/i.test(m)) m='Email này đã được đăng ký. Hãy đăng nhập.';
    setMsg(m,'err');
  }
}
</script>
<script src="mobile-nav.js"></script>
</body>
</html>
