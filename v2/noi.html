<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:linear-gradient(170deg,#fff8ed 0%,#ffeede 100%);
  color:#2d2416;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:18px 16px 40px;user-select:none;
}
.wrap{width:100%;max-width:540px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:19px;font-weight:800;color:#c2410c}
.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;background:#f3d9bd;transition:.25s}
.dots i.on{background:#f97316;transform:scale(1.25)}

.card{
  background:#fff;border:3px solid #fed7aa;border-radius:26px;
  padding:30px 22px;text-align:center;
  box-shadow:0 6px 0 #fde3c4;min-height:210px;
  display:flex;flex-direction:column;justify-content:center;gap:12px;
}
.emo{font-size:74px;line-height:1;margin-bottom:2px;letter-spacing:2px}
.chunk{font-size:36px;font-weight:800;line-height:1.28;color:#1c1917;overflow-wrap:anywhere}
.chunk b{color:#ea580c}
.vi{font-size:17px;color:#78716c;font-weight:500}
.tag{
  display:inline-block;align-self:center;font-size:12px;font-weight:700;
  color:#c2410c;background:#ffedd5;border-radius:20px;padding:4px 13px;
}

.btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
button{
  font:inherit;font-weight:800;cursor:pointer;border:none;border-radius:20px;
  padding:17px 22px;font-size:17px;transition:.12s;min-width:112px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
button:active{transform:translateY(3px)}
button:disabled{opacity:.35;cursor:default}
button span{font-size:27px;line-height:1}
.listen{background:#3b82f6;color:#fff;box-shadow:0 4px 0 #1d4ed8}
.listen:active{box-shadow:0 1px 0 #1d4ed8}
.rec{background:#ef4444;color:#fff;box-shadow:0 4px 0 #b91c1c}
.rec:active{box-shadow:0 1px 0 #b91c1c}
.rec.on{animation:pulse .8s infinite}
@keyframes pulse{50%{background:#fca5a5}}
.play{background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}
.play:active{box-shadow:0 1px 0 #15803d}
.next{
  background:#f97316;color:#fff;box-shadow:0 4px 0 #c2410c;
  width:100%;margin-top:14px;flex-direction:row;justify-content:center;padding:18px;
}
.next:active{box-shadow:0 1px 0 #c2410c}

.tip{
  margin-top:18px;background:#fffbeb;border:2px dashed #fbbf24;border-radius:18px;
  padding:15px 17px;font-size:15px;color:#78350f;line-height:1.6;
}
.tip b{color:#b45309}
.note{text-align:center;font-size:13px;color:#a8a29e;margin-top:16px;line-height:1.7}
.done{text-align:center;padding:34px 20px}
.done h2{font-size:30px;color:#c2410c;margin-bottom:10px}
.done p{font-size:17px;color:#57534e;line-height:1.75}
.big{font-size:56px;margin-bottom:8px}
.warn{
  background:#fef2f2;border:2px solid #fecaca;color:#991b1b;
  border-radius:14px;padding:11px 14px;font-size:13.5px;margin-top:14px;line-height:1.6;
}
.hidden{display:none}
</style>
</head>

</div>

  cur._text = f.text;
  const html = f.slot
    ? cur.chunk.replace('___', `<b>${f.slot}</b>`)
    : cur.chunk;
  const viHtml = f.slot
    ? cur.meaning_vi.replace('___', f.vi)
    : cur.meaning_vi;
  dots();
  $('#stage').innerHTML = `
    <div class="card">
      <div class="tag">${cur.nhom}</div>
      ${f.emo ? `<div class="emo">${f.emo}</div>` : ''}
      <div class="chunk">${html}</div>
      <div class="vi">${viHtml}</div>
    </div>
    <div class="btns">
      <button class="listen" id="b-listen"><span>🔊</span>Nghe</button>
      <button class="rec"    id="b-rec"><span>🎤</span>Thu</button>
      <button class="play"   id="b-play" disabled><span>▶️</span>Nghe lại</button>
    </div>
    <button class="next" id="b-next">Cụm tiếp theo →</button>
    ${cur.goi_y ? `<div class="tip">💡 <b>Thử với em:</b> ${cur.goi_y}</div>` : ''}
    <div id="warn"></div>`;

  $('#b-listen').onclick = speak;
  $('#b-rec').onclick    = toggleRec;
  $('#b-play').onclick   = playback;
  $('#b-next').onclick   = () => { stopRec(); seen.push(cur.ord);
    localStorage.setItem(SEEN, JSON.stringify(seen)); i++; render(); };
  setTimeout(speak, 350);           // đọc mẫu ngay, bé nghe trước đã
}

function speak() {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cur._text);
  u.lang = 'en-US';
  u.rate = 0.75;                    // chậm để bé nhại kịp
  const v = speechSynthesis.getVoices().find(v => /en-US|en_US/.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function toggleRec() {
  if (recording) return stopRec();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    media = new MediaRecorder(stream);
    chunks = [];
    media.ondataavailable = e => chunks.push(e.data);
    media.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioURL) URL.revokeObjectURL(audioURL);
      audioURL = URL.createObjectURL(new Blob(chunks, { type: 'audio/webm' }));
      $('#b-play').disabled = false;
      playback();                   // tự phát lại luôn — bé nghe chính mình
    };
    media.start();
    recording = true;
    $('#b-rec').classList.add('on');
    $('#b-rec').innerHTML = '<span>⏹️</span>Dừng';
  } catch (e) {
    $('#warn').innerHTML = `<div class="warn"><b>Chưa thu âm được.</b>
      Micro cần chạy qua <code>localhost</code> hoặc <code>https</code> —
      mở bằng <code>npx serve . -p 8080</code> thay vì nháy đúp file.
      Vẫn nghe và nhại theo bình thường được nhé.</div>`;
  }
}

function stopRec() {
  if (media && recording) media.stop();
  recording = false;
  const b = $('#b-rec');
  if (b) { b.classList.remove('on'); b.innerHTML = '<span>🎤</span>Thu'; }
}

function playback() {
  if (audioURL) new Audio(audioURL).play();
}

function finish() {
  const c = queue[queue.length - 1];
  $('#dots').innerHTML = '';
  $('#stage').innerHTML = `
    <div class="card done">
      <div class="big">🎉</div>
      <h2>Xong rồi!</h2>
      <p>Con vừa nói <b>${queue.length} câu</b> tiếng Anh.<br><br>
      Giờ ra tìm em, thử nói câu này xem em có hiểu không:</p>
      <div class="chunk" style="margin-top:14px;font-size:27px">${c._text}</div>
    </div>
    <button class="next" id="again">Tập tiếp →</button>`;
  $('#again').onclick = buildQueue;
}

speechSynthesis.onvoiceschanged = () => {};
buildQueue();
</script>
</body>
</html>
