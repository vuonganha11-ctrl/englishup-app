<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="mobile.css">
<title>EnglishUp — Bảng xếp hạng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js"></script>
<style>
:root{
  --bg:#08090d;--surface:#0e1018;--card:#151a25;--card2:#1b2133;
  --border:#232d42;--border2:#2e3a55;
  --accent:#4f8ef7;--a2:#a78bfa;--a3:#34d399;--a4:#fb923c;--a5:#f472b6;
  --gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97757;
  --danger:#f87171;--text:#dde3f0;--muted:#64748b;
  --mono:'JetBrains Mono',monospace;--radius:10px;--radius-lg:16px;--topbar-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:50}
.topbar .logo{font-weight:700;font-size:18px;color:var(--accent);letter-spacing:-.4px;text-decoration:none}
.topbar .logo span{color:var(--a2)}
.top-nav{display:flex;gap:4px;margin-left:14px;flex-wrap:wrap}
.top-nav a{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px}
.top-nav a:hover{color:var(--text);background:var(--card)}

.page{max-width:820px;margin:0 auto;padding:26px 18px 80px}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.lead{font-size:14px;color:var(--muted);margin:5px 0 20px}

.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:18px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);background:none;border:none;
     padding:9px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.on{background:var(--accent);color:#fff}

/* --- bục vinh danh --- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:20px}
.pod{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 10px;text-align:center;position:relative}
.pod.p1{border-color:rgba(251,191,36,.5);background:linear-gradient(180deg,rgba(251,191,36,.10),var(--card));padding-top:22px;padding-bottom:22px}
.pod.p2{border-color:rgba(203,213,225,.35)}
.pod.p3{border-color:rgba(217,119,87,.35)}
.pod .medal{font-size:28px;line-height:1}
.pod.p1 .medal{font-size:36px}
.pod .av{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);
         display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;margin:8px auto 6px}
.pod.p1 .av{width:54px;height:54px;font-size:19px;border-color:var(--gold);color:var(--gold)}
.pod .nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .xp{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--a4);margin-top:2px}
.pod.p1 .xp{font-size:18px;color:var(--gold)}
.pod.me{outline:2px solid var(--accent);outline-offset:2px}

/* --- bảng --- */
.board{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row.me{background:rgba(79,142,247,.10);border-left:3px solid var(--accent);padding-left:13px}
.row .rk{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--muted);text-align:center}
.row.me .rk{color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);
         display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto}
.who .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .tagme{font-size:10.5px;font-weight:700;color:var(--accent);background:rgba(79,142,247,.14);
            border:1px solid rgba(79,142,247,.4);border-radius:999px;padding:1px 7px;flex:0 0 auto}
.stk{font-size:12.5px;color:var(--a5);font-weight:600;white-space:nowrap}
.xpv{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--a4);white-space:nowrap;min-width:78px;text-align:right}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:40px 20px;line-height:1.7}

.mecard{background:linear-gradient(135deg,rgba(79,142,247,.14),rgba(167,139,250,.10));
        border:1px solid rgba(79,142,247,.4);border-radius:14px;padding:15px 18px;margin-bottom:18px;
        display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.mecard .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mecard .v{font-size:21px;font-weight:800;font-family:var(--mono)}
.cta{font-size:13.5px;color:var(--muted);text-align:center;margin-top:20px}
.cta a{color:var(--accent);font-weight:600;text-decoration:none}
.hidden{display:none!important}
@media(max-width:560px){
  .podium{grid-template-columns:1fr;align-items:stretch}
  .row{grid-template-columns:40px 1fr auto;gap:9px;padding:11px 12px}
  .stk{display:none}
  h1{font-size:20px}
}
</style>
</head>
<body>
<header class="topbar">
  <a href="report.html" class="logo">English<span>Up</span></a>
  <nav class="top-nav"></nav>
</header>

<div class="page">
  <h1>🏆 Bảng xếp hạng</h1>
  <div class="lead">Học đều mỗi ngày để leo hạng. XP cộng khi bạn chơi game, ôn flashcard và học từ vựng.</div>

  <div class="tabs">
    <button class="tab on" data-p="week"  onclick="pick(this)">📅 Tuần này</button>
    <button class="tab"    data-p="month" onclick="pick(this)">🗓️ Tháng này</button>
    <button class="tab"    data-p="all"   onclick="pick(this)">🌟 Mọi lúc</button>
  </div>

  <div class="mecard hidden" id="mecard">
    <div><div class="l">Hạng của bạn</div><div class="v" id="me-rank">—</div></div>
    <div><div class="l">XP kỳ này</div><div class="v" id="me-xp" style="color:var(--a4)">—</div></div>
    <div><div class="l">Chuỗi ngày</div><div class="v" id="me-streak" style="color:var(--a5)">—</div></div>
  </div>

  <div class="podium hidden" id="podium"></div>
  <div class="board" id="board"><div class="empty">Đang tải…</div></div>

  <div class="cta">Muốn kéo cả hội cùng leo hạng? <a href="gioithieu.html">Mời bạn bè vào học →</a></div>
</div>

<script>
const SB_URL='https://fyglubimflzsetcovgqx.supabase.co';
const SB_KEY='sb_publishable_3h3EQvxWr0kba8Tyq5RNbQ_driFn_G_';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{lock:(_n,_t,fn)=>fn()}});

let PERIOD='week', LOGGED=false;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini = n => { const p=String(n||'?').trim().split(/\s+/);
  return ((p[0]||'?')[0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase(); };

function pick(btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on'); PERIOD=btn.dataset.p; load();
}

(async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  LOGGED = !!session;
  load();
})();

async function load(){
  document.getElementById('board').innerHTML='<div class="empty">Đang tải…</div>';
  document.getElementById('podium').classList.add('hidden');

  const { data, error } = await sb.rpc('leaderboard', { p_period: PERIOD, p_limit: 100 });
  if(error){
    document.getElementById('board').innerHTML='<div class="empty">Không tải được bảng xếp hạng.<br>'+esc(error.message)+'</div>';
    return;
  }
  const rows = data||[];
  if(!rows.length){
    document.getElementById('board').innerHTML =
      '<div class="empty">Chưa có ai ghi điểm '+(PERIOD==='week'?'tuần này':PERIOD==='month'?'tháng này':'')+'.<br>'+
      'Vào <a href="game.html" style="color:var(--accent)">Game</a> hoặc <a href="flashcard.html" style="color:var(--accent)">Flashcard</a> để mở màn nhé!</div>';
    renderMe(null);
    return;
  }

  // bục vinh danh top 3
  const top = rows.slice(0,3);
  if(top.length===3){
    const order=[top[1],top[0],top[2]], cls=['p2','p1','p3'], medal=['🥈','🥇','🥉'];
    document.getElementById('podium').innerHTML = order.map((r,i)=>
      '<div class="pod '+cls[i]+(r.is_me?' me':'')+'">'+
        '<div class="medal">'+medal[i]+'</div>'+
        '<div class="av">'+esc(ini(r.name))+'</div>'+
        '<div class="nm">'+esc(r.name)+'</div>'+
        '<div class="xp">'+Number(r.xp).toLocaleString('vi-VN')+' XP</div>'+
      '</div>').join('');
    document.getElementById('podium').classList.remove('hidden');
  }

  const list = top.length===3 ? rows.slice(3) : rows;
  document.getElementById('board').innerHTML = list.length ? list.map(r=>
    '<div class="row'+(r.is_me?' me':'')+'">'+
      '<div class="rk">'+r.rank+'</div>'+
      '<div class="who"><div class="av">'+esc(ini(r.name))+'</div>'+
        '<div class="nm">'+esc(r.name)+'</div>'+
        (r.is_me?'<span class="tagme">BẠN</span>':'')+'</div>'+
      '<div class="stk">'+(r.streak>0 ? '🔥 '+r.streak : '')+'</div>'+
      '<div class="xpv">'+Number(r.xp).toLocaleString('vi-VN')+' XP</div>'+
    '</div>').join('') : '<div class="empty">Chỉ mới có top 3 — vào học để chen chân nhé 💪</div>';

  renderMe(rows.find(r=>r.is_me) || null);
}

async function renderMe(inList){
  const box=document.getElementById('mecard');
  if(!LOGGED){ box.classList.add('hidden'); return; }
  let rank=null, xp=0, streak=0;
  if(inList){ rank=inList.rank; xp=inList.xp; streak=inList.streak; }
  else{
    const { data } = await sb.rpc('my_rank',{ p_period: PERIOD });
    if(data && data.ok){ rank=data.rank; xp=data.xp||0; streak=data.streak||0; }
  }
  document.getElementById('me-rank').textContent   = rank ? ('#'+rank) : '—';
  document.getElementById('me-xp').textContent     = Number(xp).toLocaleString('vi-VN');
  document.getElementById('me-streak').textContent = (streak||0) + ' 🔥';
  box.classList.remove('hidden');
}
</script>
<script src="mobile-nav.js"></script>
</body>
</html>
